name: check-bot-block

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 봇 차단 여부 진단
        run: python check_bot_block.py

      - name: 스크린샷을 아티팩트로 업로드 (실패해도 항상 업로드)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-check-screenshots
          path: botcheck_*.png
          if-no-files-found: warn
