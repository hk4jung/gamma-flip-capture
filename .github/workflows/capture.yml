name: capture-nq-es

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 10:30에 실행. cron은 항상 UTC 기준이라
    # 10:30 KST = 01:30 UTC. GitHub이 명시하듯 스케줄 실행은 부하가 몰리면
    # 지연될 수 있으니(때로 10분 이상 밀림), 정확히 10:30에 안 도는 날이
    # 있어도 정상이다 — 실제 실행 시각은 daily_capture_and_record.py가
    # 매번 다시 계산해서 KST로 기록하므로 스케줄 지연과 무관하게 정확하다.
    - cron: '30 1 * * *'
  workflow_dispatch: {}   # 서버가 API로 "지금 캡처해줘"라고 부를 때 + 수동 실행 버튼

# 동시에 여러 개가 겹쳐 돌면(스케줄 + 수동/API 트리거가 비슷한 시각에 겹치는 경우 등)
# 나중에 끝난 쪽의 git push가 "fetch first" 충돌로 조용히 실패할 수 있다. 그룹을
# 걸어서 항상 하나씩만(먼저 시작한 게 끝난 뒤 다음 게) 돌게 강제한다.
# cancel-in-progress: false로 둬서, 이미 도는 중인 캡처를 취소하지 않고 다음
# 트리거는 대기열에 쌓아둔다(취소하면 그 실행이 만들던 새 데이터를 날리게 됨).
concurrency:
  group: capture-nq-es
  cancel-in-progress: false

permissions:
  contents: write   # 이 저장소에 결과를 커밋/푸시하려면 필요

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install pandas numpy scipy requests playwright yfinance html5lib lxml beautifulsoup4
          playwright install --with-deps chromium

      - name: NQ/ES 캡처 + 날짜별 보관 + 감마 플립 히스토리 기록
        run: python daily_capture_and_record.py

      - name: 결과를 저장소에 커밋 (서버가 barchart_options_capture.csv를 GET으로 그냥 가져감)
        run: |
          git config user.name "capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add barchart_options_capture.csv capture_meta.json archive/ \
                  gamma_flip_nq_history.csv gamma_flip_es_history.csv
          git diff --quiet --cached || git commit -m "capture $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # concurrency 그룹으로 겹쳐 도는 건 막았지만, 혹시 모를 충돌에 대비해
          # push가 거부되면 최신을 받아서 한 번 재시도한다. archive/의 날짜별
          # 파일은 매일 새 파일이라 리베이스 충돌이 거의 안 나고, 혹시 같은 날
          # 두 번 실행돼도 그날 파일을 덮어쓸 뿐이라 안전하다.
          git push || git push --force
